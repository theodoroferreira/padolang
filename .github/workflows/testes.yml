name: Testes

on:
  push:
    branches: [main, ferramentas]
  pull_request:
    branches: [main, ferramentas]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o testar-zed.sh confere o rev da gramática no extension.toml

      - name: Instalar o JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Versões das ferramentas
        run: |
          java -version
          gcc --version

      - name: Compilar o transpilador
        run: ./compilar.sh

      - name: Rodar testes e exemplos
        run: ./testar.sh

      - name: Testar o léxico no modo editor
        run: ./testar-lexer-editor.sh

      - name: Testar a CLI
        run: |
          bin/padolang --version
          bin/padolang check --json testes/05_erro_semantico_divisao_por_zero.padoin | grep -q '"codigo":"R14"'
          ./testar-cli.sh

      - name: Testar o formatador
        run: ./testar-formatador.sh

      - name: Testar o servidor LSP
        run: ./testar-lsp.sh

      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            editores/vscode/package-lock.json
            editores/tree-sitter-padolang/package-lock.json

      - name: Extensão VS Code (gramática e .vsix)
        working-directory: editores/vscode
        run: |
          npm ci
          npm test
          npm run empacotar

      - name: Instalar o alvo wasm32-wasip2 do Rust (extensão do Zed)
        run: rustup target add wasm32-wasip2

      - name: Gramática Tree-sitter e extensão do Zed
        run: |
          (cd editores/tree-sitter-padolang && npm ci)
          EXIGIR_TUDO=1 ./testar-zed.sh

      - name: Guardar a extensão VS Code
        uses: actions/upload-artifact@v4
        with:
          name: padolang-vsix
          path: editores/vscode/*.vsix

      - name: Guardar o código C gerado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codigo-c-gerado
          path: saida/*.c
          if-no-files-found: ignore
